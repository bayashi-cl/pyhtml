name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Tests and type checks
    runs-on: ubuntu-latest
    env:
      VNU_URL: http://127.0.0.1:8888/
    services:
      # Nu Html Checker for tests/test_vnu.py, pinned by digest (version 26.9.7).
      vnu:
        image: ghcr.io/validator/validator@sha256:8d1a69110a40900c31fb37426dfac2f20d8d26d12431255e1c38cfcefae08cbd
        ports:
          - 8888:8888
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # python-version is left unset so uv picks it up from .python-version.
      # setup-uv publishes no floating major tags, so pin the full version.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-python: true

      - name: Install dependencies
        id: sync
        run: uv sync --locked

      # The service container is started before the steps, but the checker needs a
      # few seconds before it accepts requests.
      - name: Wait for the Nu Html Checker
        run: |
          for _ in $(seq 60); do
            curl -sf -o /dev/null "$VNU_URL" && exit 0
            sleep 1
          done
          echo "vnu did not start" >&2
          exit 1

      # Each check runs even if an earlier one fails, so one run reports all failures.
      - name: pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --locked pytest

      - name: ty
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --locked ty check

      # pyright's Python wrapper uses the runner's preinstalled Node.js from PATH.
      - name: Node.js for pyright
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: node --version

      - name: pyright
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --locked pyright

      - name: ruff check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --locked ruff check .

  prek:
    name: prek hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Runs `prek run --show-diff-on-failure --all-files`.
      # prek-action publishes no floating major tags, so pin the full version.
      - uses: j178/prek-action@v3.0.0
